# Project configuration (claimstore.config): every path, the pipeline, the release rules and facts about this field.
# Values may use {repo} and {data_root}; relative paths are relative to the repository. Environment variables
# AD_SC_CLAIMS_<NAME> override paths (e.g. AD_SC_CLAIMS_DATA_ROOT).

[project]
name = "ad-sc-claims"
title = "AD single-cell claim store"
description = "Claims of human post-mortem brain Alzheimer's disease single-nucleus studies, each re-tested donor-level across harmonised datasets and rated for certainty."
keywords = ["Alzheimer's disease", "single-nucleus", "replication", "meta-analysis", "knowledge graph"]
server_name = "ad-sc-claims"
licence = "CC BY 4.0 (data and text); code Apache-2.0"
env_prefix = "AD_SC_CLAIMS"

[server]
# The MCP server's instructions (a file next to this one) and the ids quoted in its tool descriptions
instructions = "server_instructions.md"
examples = { claim = "mathys2019-C01", finding = "F-example", statement = "CS01", gene = "APOE", cell = "Microglia", region = "PFC", dataset = "seaad", background = "BG-example", paper = "mathys2019", cell_types = "Microglia, Excitatory neurons, All", regions = "PFC, EC, MTG" }

[claims]
# Papers whose claims were made on another paper's cohort: paper id -> dataset id
paper_to_dataset = { gabitto2024 = "seaad" }
# How the store describes samples and claims of this field (claimstore.build_store)
sample_type = "post-mortem brain"
heritability_label = "AD genetic risk"
stage_available_column = "stage_available"
staging_field = "staging"

[rating]
# Test templates of each rating family (claims/RATING.md section 2)
effect_templates = ["composition_clr", "composition_labels", "composition_clr_sex", "sex_pathology_shift", "de_genes",
                    "geneset_shift", "state_genes_shift", "trajectory_genes", "communication_genes"]
pattern_templates = ["state_existence", "gwas_magma_specificity", "gwas_magma", "familial_overlap", "twas_de_enrichment"]
# Datasets of sorted nuclei or cells, whose composition is not tissue composition
enriched_sort = []
# Datasets that may share donors: dataset -> other datasets (a caveat on the rating, not merged)
shared_banks = {}
shared_bank_caveat = "{dataset} may share donors with {others} (not verified)"
not_assessed = "a gradient with disease stage; adjustment for age, sex and sample quality"

[tests]
# Claim re-tests (claimstore.retest). Gene symbols renamed since publication: old = "new" (MARCH*/SEPT* built in)
gene_aliases = {}
# Contrast codes that compare two contrasts' fold changes: code = { contrasts = ["a", "b"], template = "name" }
concordance = {}
# genetic_enrichment claims: "module:function" of this field's package (none: such claims are not testable).
# AD (2026-11-18): TWAS genes vs DEGs; GWAS heritability claims need summary statistics this project does not have
genetic_test = "ad_sc_claims.genetics:genetic_test"
# A curated signature whose rows name cell classes is applied per class (claims/SIGNATURES.md)
signatures_per_class = true
# Claims with the contrast "sex" are tested within each sex (claims/sex_claims.tsv, claims/CURATED_TESTS.md)
sex = { column = "sex", contrast = "AD_vs_control" }

[atlas]
# The atlas page (src/claimstore/cli.py atlas -> reports/atlas.html); every key is optional (claimstore.atlas)
title = "AD brain atlas"
headline = "What the single-cell studies of the Alzheimer's disease brain claim, and what holds up"
lead = "Claims of human post-mortem Alzheimer's disease single-nucleus studies."
disease = "AD"
case_label = "AD vs control"
scope = "single-nucleus studies of the human post-mortem Alzheimer's disease (AD) brain"
examples = ["Do disease-associated microglia expand in AD?", "Which claims about astrocytes hold up across datasets?",
            "Are SST interneurons lost early in AD?", "Which claims were contradicted when re-tested?"]
ask_placeholder = "Ask a question about the AD brain, e.g. what happens to microglia?"
stop_words = ["ad", "alzheimer", "alzheimers"]

[paths]
# The data area (large, not in git): `data/` in the repository, a link to wherever the data live, or
# AD_SC_CLAIMS_DATA_ROOT
data_root = "data"
work = "{data_root}/ad_sc_claims"
legacy = "{repo}/.."
genome_fa = "{data_root}/genome.fa"

[envs]
python = ""
r_env = ""

[pipeline]
# Datasets the pipeline builds and tests, one loader each: src/ad_sc_claims/build/<dataset>.py
loaders = "ad_sc_claims.build"
# 2026-11-17: Leng 2021, Lau 2020 and Sun 2023 (microglia) added; Grubman 2019 left out (GEO samples pool two
# donors each, so no donor-level test)
datasets = ["psychad", "seaad", "leng2021", "lau2020", "sun2023"]
default_mem_gb = 64
de_contrasts = ["AD_vs_control"]
gsea_contrasts = []
gsea_classes = []

[release]
public_repository = "https://github.com/sergiomarco25/ad-sc-claims"
# Datasets and papers kept out of every public export, and findings re-derived without them
private_datasets = []
private_papers = []
separable_findings = []
private_modules = []

[release.rederived_findings]
