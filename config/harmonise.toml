# Harmonisation of the AD field: the common schema of every harmonised dataset and the rules that check cell classes
# against marker genes (claimstore.harmonise). Set 2026-11-16 for PsychAD and SEA-AD.
#
# A loader (src/ad_sc_claims/build/<dataset>.py) returns an AnnData with raw integer counts in X (cells x genes, gene
# symbols as var_names) and the `obs` columns below (values it cannot fill: NaN / "unknown"), plus AUTHOR_TO_CLASS
# mapping its author cell labels to `cell_classes`.

# Cell metadata every harmonised dataset carries. Between `region` and `author_cell_type` are the donor-level columns
# of the donor table; `braak_nft` (Braak neurofibrillary tangle stage, 0-6) is the stage ([stage] in
# config/contrasts.toml).
obs = ["dataset", "donor", "sample", "region", "disease", "disease_raw", "sex", "age", "pmi", "braak_nft",
       "author_cell_type", "cell_class"]
# Donor-level columns beyond the schema that the pseudobulk unit table carries when a dataset has them
# adnc: NIA-AA AD neuropathologic change (Not AD / Low / Intermediate / High); cps: SEA-AD continuous
# pseudo-progression score; comorbidity: other diagnoses of the donor
donor_extras = ["adnc", "thal_phase", "cerad", "apoe4", "cognitive_status", "lewy_body_pathology", "late_nc", "cps",
                "comorbidity", "age_censored"]
# Values a loader may use (the claim vocabularies are config/schema.toml)
regions = ["PFC", "DLPFC", "SFG", "MTG", "EC", "hippocampus", "AG", "thalamus", "occipital"]
diseases = ["control", "AD", "other"]
cell_classes = ["Excitatory neurons", "Inhibitory neurons", "Neurons (other)", "Astrocytes", "Microglia",
                "Oligodendrocytes", "OPCs", "Endothelial", "Pericytes", "Fibroblasts", "T cells", "Immune (other)",
                "Unknown"]
# Datasets mixing sorted and unsorted nuclei (obs `enrichment` = "sorted"): these classes are tested on sorted units
sorted_classes = []

# Canonical markers of each class (a class needs >= 2 detected genes); used to check the authors' labels
[markers]
"Excitatory neurons" = ["SLC17A7", "SATB2", "SLC17A6", "CAMK2A", "NRGN"]
"Inhibitory neurons" = ["GAD1", "GAD2", "SLC32A1", "SST", "PVALB"]
"Neurons (other)" = ["RBFOX3", "SNAP25", "SYT1", "STMN2"]
"Astrocytes" = ["AQP4", "GJA1", "SLC1A2", "GFAP", "ALDH1L1", "SLC1A3"]
"Microglia" = ["P2RY12", "CX3CR1", "CSF1R", "DOCK8", "TMEM119"]
"Oligodendrocytes" = ["MBP", "PLP1", "MOBP", "ST18", "MOG"]
"OPCs" = ["PDGFRA", "VCAN", "PTPRZ1", "OLIG1"]
"Endothelial" = ["CLDN5", "FLT1", "VWF", "PECAM1"]
"Pericytes" = ["PDGFRB", "RGS5", "KCNJ8", "ACTA2"]
"Fibroblasts" = ["DCN", "COL1A2", "LUM", "COL1A1"]
"T cells" = ["CD3E", "CD3D", "CD2", "SKAP1", "CD247"]          # no THEMIS (L6 excitatory neurons) or IL7R
"Immune (other)" = ["MRC1", "F13A1", "CD163", "LYVE1", "MS4A1"]  # no PTPRC: microglia express it

# Two-step class call (claimstore.harmonise.classify): the lineage first (`pan_neuronal` against each non-neuronal
# class), then the neuron subtype for neuron rows
[labelling]
neuron_subtypes = ["Excitatory neurons", "Inhibitory neurons"]
pan_neuronal = "Neurons (other)"
subtype_min_z = 0.5
min_raw = 0.1
precedence = {}

# Classes only plausible in some regions: "Class name" = ["region", ...]
[labelling.region_only]

# Classes a cluster can take only if any listed gene is detected in at least this fraction of its nuclei
[labelling.require_detect]
