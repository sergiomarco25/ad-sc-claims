# Contrasts of the AD field: which donor x region units are case and which are reference (claimstore.contrasts).
#   column = "value" | ["a", "b"] | { contains = "x" } ;  braak_nft = { min = 5 }  (stage defined in [stage])

[stage]
name = "braak_nft"
columns = ["braak_nft"]
group_column = "disease"
zero_group = "control"
# The stage as a continuous covariate: claims along AD pathology (contrast code ad_pathology, config/contexts.toml)
# are tested along Braak NFT stage, the donor-level pathology measure every staged dataset has
contrast = "ad_pathology"
label = "Braak NFT stage"

[contrasts.AD_vs_control]
case = { disease = "AD" }
ref = { disease = "control" }

[contrasts.ADlate_vs_control]
case = { disease = "AD", braak_nft = { min = 5 } }
ref = { disease = "control" }

[contrasts.ADearly_vs_control]
case = { disease = "AD", braak_nft = { min = 1, max = 4 } }
ref = { disease = "control" }

# Better vs worse cognition: donors without dementia vs donors with dementia (all pathology levels; SEA-AD cognitive
# status). Claims along cognition or resilience are tested on this split; datasets without cognitive status cannot.
[contrasts.cognition]
case = { cognitive_status = "No dementia" }
ref = { cognitive_status = "Dementia" }
