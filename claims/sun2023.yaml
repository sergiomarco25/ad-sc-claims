- id: sun2023-C01
  paper: sun2023
  statement: "Human microglia from aged brains fall into 12 transcriptional states: homeostatic (MG0), neuronal surveillance (MG1), three inflammatory states (MG2, MG8, MG10), ribosome biogenesis (MG3), lipid-processing (MG4), phagocytic (MG5), stress-related (MG6), glycolytic (MG7), antiviral (MG11) and cycling (MG12)."
  quote: "We annotate 12 microglial transcriptional states, including AD-dysregulated homeostatic, inflammatory, and lipid-processing states"
  location: "Fig. 1A-B; Fig. S1C-G; Results \"Characterization of Microglia Transcriptional States\""
  centrality: headline
  modality: snRNA
  region: multiple
  cell_type: Microglia
  cell_state: "MG0 homeostatic; MG1 neuronal surveillance; MG2 inflammatory I (CPEB4/TMEM163/IL4R); MG3 ribosome biogenesis; MG4 lipid-processing; MG5 phagocytic; MG6 stress-related; MG7 glycolytic; MG8 inflammatory II (LRRK2/SPON1/FOXP1); MG10 inflammatory III (IL1B/CCL3/RELB); MG11 antiviral; MG12 cycling"
  claim_type: state_existence
  direction: exists
  comparison: "all donors (non-AD, early AD, late AD)"
  genes: [P2RY12, CX3CR1, CPEB4, TMEM163, IL4R, PPARG, LRRK2, SPON1, FOXP1, IL1B, CCL3, RELB, CSF1R, CD74, C3]
  gene_source: "Table S1 pages 2-3 (2,228 state markers); Fig. 1B; ROSMAP.Microglia.6regions...clusterDEGs.txt at compbio.mit.edu/microglia_states"
  reported_stat: "152,459 microglia nuclei from 443 donors, 6 regions; markers by Wilcoxon (min.pct 0.25, logFC 0.25)"
  unit_of_analysis: cells
  method: "in-silico sorting of immune nuclei, Harmony + Seurat clustering (resolution 0.5), Wilcoxon markers, Enrichr GO"
  testable_with: rna
  test_template: state_signature
  requires: "enough microglia per donor for state mapping"
  notes: "Cluster 9 (BAMs), 13 (T cells), 14-15 (doublets) were excluded, so there is no MG9. MG3, MG6, MG10, MG11 and MG12 align strongly with Olah et al. 2020 states and MG0 weakly. All states are found in all 6 regions, but their proportions differ between regions (Fig. S2B-C)."
